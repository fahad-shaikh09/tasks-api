<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tasks App{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">Tasks App</a>
            <div class="nav-links">
                <a href="/">All Tasks</a>
                <a href="/tasks/new">New Task</a>
                <div class="notif-wrapper" id="notif-wrapper">
                    <button class="notif-btn" id="notif-btn" aria-label="Notifications">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                        </svg>
                        <span id="notif-badge" class="notif-badge" style="display:none;"></span>
                    </button>
                    <div class="notif-dropdown" id="notif-dropdown">
                        <div class="notif-dropdown-header">
                            <strong>Notifications</strong>
                            <button class="notif-clear-btn" id="notif-clear-btn">Clear all</button>
                        </div>
                        <div class="notif-dropdown-body" id="notif-dropdown-body">
                            <div class="notif-empty">No notifications</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>Tasks API Frontend - Built with FastAPI</p>
        </div>
    </footer>

    <script>
        const btn = document.getElementById('notif-btn');
        const dropdown = document.getElementById('notif-dropdown');
        const badge = document.getElementById('notif-badge');
        const body = document.getElementById('notif-dropdown-body');
        const clearBtn = document.getElementById('notif-clear-btn');

        // Toggle dropdown on click
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = dropdown.classList.toggle('open');
            if (isOpen) loadNotifications();
        });

        // Close when clicking outside
        document.addEventListener('click', (e) => {
            if (!document.getElementById('notif-wrapper').contains(e.target)) {
                dropdown.classList.remove('open');
            }
        });

        // Clear all notifications
        clearBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            fetch('/api/notification-count', { method: 'DELETE' })
                .then(() => {
                    badge.style.display = 'none';
                    body.innerHTML = '<div class="notif-empty">No notifications</div>';
                })
                .catch(() => {});
        });

        // Fetch and render notifications
        function loadNotifications() {
            fetch('/notifications/data')
                .then(r => r.json())
                .then(items => {
                    if (!items.length) {
                        body.innerHTML = '<div class="notif-empty">No notifications</div>';
                        return;
                    }
                    body.innerHTML = items.map(n => {
                        const icon = n.event_type === 'task-created' ? '+' :
                                     n.event_type === 'task-updated' ? '~' : '-';
                        const cls  = n.event_type === 'task-created' ? 'created' :
                                     n.event_type === 'task-updated' ? 'updated' : 'deleted';
                        const ago = timeAgo(n.timestamp);
                        return `<div class="notif-item notif-item--${cls}">
                            <span class="notif-item-icon notif-item-icon--${cls}">${icon}</span>
                            <div class="notif-item-content">
                                <div class="notif-item-msg">${n.message}</div>
                                <div class="notif-item-time">${ago}</div>
                            </div>
                        </div>`;
                    }).join('');
                })
                .catch(() => {
                    body.innerHTML = '<div class="notif-empty">Failed to load</div>';
                });
        }

        // Fetch badge count on page load
        fetch('/api/notification-count')
            .then(r => r.json())
            .then(data => {
                if (data.count > 0) {
                    badge.textContent = data.count > 9 ? '9+' : data.count;
                    badge.style.display = 'flex';
                }
            })
            .catch(() => {});

        // Simple relative time
        function timeAgo(ts) {
            const diff = (Date.now() - new Date(ts).getTime()) / 1000;
            if (diff < 60) return 'just now';
            if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
            return Math.floor(diff / 86400) + 'd ago';
        }
    </script>
</body>
</html>
