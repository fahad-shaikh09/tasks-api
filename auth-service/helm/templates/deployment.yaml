apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8003
              protocol: TCP
          env:
            - name: PORT
              value: "8003"
            - name: BETTER_AUTH_URL
              value: {{ .Values.baseUrl | quote }}
            - name: BETTER_AUTH_COOKIE_DOMAIN
              value: {{ .Values.cookieDomain | quote }}
            - name: BETTER_AUTH_COOKIE_SECURE
              value: {{ .Values.cookieSecure | quote }}
            - name: TRUSTED_ORIGINS
              value: {{ .Values.trustedOrigins | quote }}
            - name: DEFAULT_REDIRECT_URL
              value: {{ .Values.defaultRedirectUrl | quote }}
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-secret
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
