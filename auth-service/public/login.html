<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Task Manager</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="card">
    <h1>Sign in</h1>
    <p class="sub">Welcome back. Sign in to manage your tasks.</p>

    <form id="form" autocomplete="on">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email" />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" />

      <button type="submit">Sign in</button>
    </form>

    <div class="error" id="error"></div>

    <div class="divider">or continue with</div>
    <div class="social">
      <button type="button" data-provider="google">Google</button>
      <button type="button" data-provider="github">GitHub</button>
    </div>

    <p class="footer">
      No account? <a id="signup-link" href="/signup">Create one</a>
    </p>
  </div>

  <script src="/config.js"></script>
  <script src="/static/auth.js" defer></script>
  <script defer>
    document.addEventListener("DOMContentLoaded", () => {
      // Preserve ?redirect across navigation to /signup
      const link = document.getElementById("signup-link");
      const params = new URLSearchParams(window.location.search);
      if (params.get("redirect")) {
        link.href = "/signup?" + params.toString();
      }

      document.getElementById("form").addEventListener("submit", (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        window.AUTH.signInEmail(email, password);
      });

      document.querySelectorAll(".social button").forEach((btn) => {
        btn.addEventListener("click", () => {
          window.AUTH.signInSocial(btn.dataset.provider);
        });
      });
    });
  </script>
</body>
</html>
