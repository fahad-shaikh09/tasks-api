replicaCount: 1

image:
  repository: image-registry.openshift-image-registry.svc:5000/tasks-app/frontend
  tag: latest
  pullPolicy: Always

service:
  type: NodePort
  port: 8001
  nodePort: 30001

# ConfigMap values (non-sensitive)
config:
  # Use K8s internal service DNS for backend communication
  backendUrl: "http://backend:8000"
  # Notification service URL — frontend fetches notifications from here
  notificationUrl: "http://notification:8002"

# Dapr Configuration
dapr:
  enabled: true
  appId: "tasks-api-frontend"
  appPort: "8001"
  logLevel: "info"

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi
