{{- if and .Values.secrets.enabled (not .Values.vault.enabled) }}
# Kubernetes Secret (fallback when Vault is not enabled)
# WARNING: Prefer using Vault for production deployments
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  labels:
    app: {{ .Release.Name }}
type: Opaque
data:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | b64enc | quote }}
  SECRET_KEY: {{ .Values.secrets.secretKey | b64enc | quote }}
{{- end }}
