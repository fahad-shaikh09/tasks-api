# HashiCorp Vault Helm Chart Values
# Install with: helm install vault hashicorp/vault -f vault-helm-values.yaml -n vault --create-namespace

global:
  enabled: true
  tlsDisable: false

injector:
  enabled: true
  replicas: 1

  # Resources for the injector
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 250m

  # Metrics for monitoring
  metrics:
    enabled: true

  # Webhook configuration
  webhook:
    failurePolicy: Ignore
    matchPolicy: Exact
    timeoutSeconds: 30

server:
  enabled: true

  # Development mode for testing (DO NOT use in production)
  # dev:
  #   enabled: true

  # Production configuration
  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        tls_disable = 0
        address = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_cert_file = "/vault/userconfig/vault-server-tls/tls.crt"
        tls_key_file = "/vault/userconfig/vault-server-tls/tls.key"
      }

      storage "file" {
        path = "/vault/data"
      }

  # Resource limits
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 500m

  # Persistent storage
  dataStorage:
    enabled: true
    size: 1Gi
    storageClass: null
    accessMode: ReadWriteOnce

  # Audit logs storage
  auditStorage:
    enabled: true
    size: 1Gi
    storageClass: null
    accessMode: ReadWriteOnce

  # Service configuration
  service:
    enabled: true
    type: ClusterIP
    port: 8200
    targetPort: 8200

  # Ingress (optional - configure based on your ingress controller)
  ingress:
    enabled: false
    # ingressClassName: nginx
    # hosts:
    #   - host: vault.example.com

ui:
  enabled: true
  serviceType: ClusterIP
  serviceNodePort: null
  externalPort: 8200
