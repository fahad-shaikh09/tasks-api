[project]
enable_telemetry = false
session_timeout = 3600
user_env = []
allow_origins = ["*"]
# Required so Chainlit invokes @cl.header_auth_callback. Without this,
# the callback is registered but never called.
# (Chainlit also needs CHAINLIT_AUTH_SECRET env var set at runtime.)


[features]
unsafe_allow_html = false
latex = false
auto_tag_thread = true

[UI]
name = "Task Manager"
default_collapse_content = true
cot = "hidden"
custom_css = "/public/notif-bell.css"
custom_js = "/public/notif-bell.js"

[meta]
generated_by = "tasks-api"
