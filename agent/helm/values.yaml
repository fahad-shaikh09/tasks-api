replicaCount: 1

image:
  repository: image-registry.openshift-image-registry.svc:5000/tasks-app/agent
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8000

# OpenShift Route — exposes the Chainlit UI to your browser
route:
  enabled: true
  host: ""  # Leave empty for auto-generated: agent-tasks-app.apps-crc.testing

# Environment variables
env:
  # MCP server is in the same namespace, reachable via K8s service DNS
  mcpServerUrl: "http://mcp-server:8001/mcp"
  notificationServiceUrl: "http://notification:8002"
  # Used to validate session cookies issued by better-auth (in-cluster DNS)
  authServiceUrl: "http://auth-service:8003"
  # Public URL of auth-service for browser redirects (must be reachable from the user's browser)
  authServicePublicUrl: "http://auth-service-tasks-app.apps-crc.testing"
  # Override during install: --set env.openaiApiKey="sk-..."
  openaiApiKey: ""
  # Chainlit refuses to enable auth_callbacks without this secret.
  # Generate with: openssl rand -hex 32
  chainlitAuthSecret: "change-me-chainlit-auth-secret"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
